name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, analyse et APK de développement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires (moteur TCC-I et logique d'écran)
        run: |
          set -o pipefail
          ./gradlew test 2>&1 | tee -a gradle.log

      - name: Analyse Android (lint)
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug 2>&1 | tee -a gradle.log

      - name: APK de développement
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee -a gradle.log

      # Remonte l'erreur en annotation, lisible directement sur la page de l'exécution.
      - name: Résumer l'erreur
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Caused by|FAILED|Exception|Error:" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sommelle-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
