name: Captures d'écran

# Régénère les captures de la documentation (docs/captures) à partir du code des écrans,
# sans téléphone ni émulateur, et les enregistre dans le dépôt quand elles changent.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/designsystem/**"
      - "core/presentation/**"
      - "feature/**"
      - "screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  record:
    name: Générer les captures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Afficher les écrans
        run: |
          set -o pipefail
          ./gradlew :screenshots:recordPaparazziDebug 2>&1 | tee gradle.log

      # Remonte l'erreur en annotation, lisible directement sur la page de l'exécution.
      - name: Résumer l'erreur
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Caused by|FAILED|Exception" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Copier dans docs/captures
        run: |
          mkdir -p docs/captures
          for f in screenshots/src/test/snapshots/images/*.png; do
            name=$(basename "$f")
            cp "$f" "docs/captures/${name#*ScreensTest_}"
          done
          ls -la docs/captures

      - name: Enregistrer si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/captures
          if git diff --cached --quiet; then
            echo "Captures inchangées."
          else
            git commit -m "Captures d'écran à jour"
            git push
          fi

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-captures
          path: screenshots/build/reports/
          retention-days: 7
