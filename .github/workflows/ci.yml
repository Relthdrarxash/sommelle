name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, analyse et APK de développement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires (moteur TCC-I et logique d'écran)
        run: ./gradlew test --stacktrace

      - name: Analyse Android (lint)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: APK de développement
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sommelle-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
