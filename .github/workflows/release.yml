name: Publication

# Une étiquette v1.2.3 poussée sur GitHub produit un APK signé et une version publiée.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: APK signé et version GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests unitaires
        run: ./gradlew test

      - name: Restaurer la clé de signature
        env:
          SOMMELLE_KEYSTORE_BASE64: ${{ secrets.SOMMELLE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SOMMELLE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SOMMELLE_KEYSTORE_BASE64 manquant : voir CONTRIBUTING.md, section Publication."
            exit 1
          fi
          echo "$SOMMELLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sommelle.jks"
          echo "SOMMELLE_KEYSTORE_PATH=$RUNNER_TEMP/sommelle.jks" >> "$GITHUB_ENV"

      - name: APK et bundle signés
        env:
          SOMMELLE_KEYSTORE_PASSWORD: ${{ secrets.SOMMELLE_KEYSTORE_PASSWORD }}
          SOMMELLE_KEY_ALIAS: ${{ secrets.SOMMELLE_KEY_ALIAS }}
          SOMMELLE_KEY_PASSWORD: ${{ secrets.SOMMELLE_KEY_PASSWORD }}
          SOMMELLE_VERSION_NAME: ${{ github.ref_name }}
          SOMMELLE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Renommer les fichiers
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sommelle-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "sommelle-${GITHUB_REF_NAME}.aab"
          sha256sum "sommelle-${GITHUB_REF_NAME}.apk" > "sommelle-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sommelle-${{ github.ref_name }}.apk
            sommelle-${{ github.ref_name }}.apk.sha256
            sommelle-${{ github.ref_name }}.aab
